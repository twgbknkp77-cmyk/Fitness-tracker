<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#121212">

  <title>Fitness Tracker</title>

  <!-- MAIN STYLESHEET -->
  <link rel="stylesheet" href="style.css?v=3">
</head>

<body>

  <main>

    <!-- DASHBOARD PAGE -->
    <section id="dashboard" class="page active">

      <h1>Dashboard</h1>

      <!-- NEXT WORKOUT -->
      <div class="card">
        <h2>Next Up</h2>

        <p>No workout scheduled</p>

        <button
          class="primary-button"
          onclick="showPage('workouts')">
          View Workouts →
        </button>
      </div>

      <!-- WEEKLY PROGRESS -->
      <div class="card">

        <h2>Workouts This Week</h2>

        <h1>0 / 0</h1>

        <p>Completed workouts this week</p>

        <div class="progress-track">
          <div class="progress-fill"></div>
        </div>

      </div>

      <!-- BODYWEIGHT -->
<div class="card bodyweight-card">

  <!-- HEADING -->
  <h2>
    Bodyweight —
    <span id="currentWeight">-- kg</span>
  </h2>

  <!-- GRAPH TIME FILTERS -->
  <div class="weight-filters">
    <button type="button" data-days="7">7D</button>
    <button type="button" data-days="30" class="active">30D</button>
    <button type="button" data-days="90">3M</button>
    <button type="button" data-days="180">6M</button>
    <button type="button" data-days="365">1Y</button>
  </div>

  <!-- BODYWEIGHT GRAPH -->
  <div id="weightChart"></div>

  <!-- ADD WEIGHT BUTTON -->
  <button
    type="button"
    id="openWeightModal"
    class="primary-button"
  >
    + Add Weight
  </button>

  <p id="weightMessage" aria-live="polite"></p>

</div>

<!-- ADD WEIGHT POP-UP -->
<dialog id="weightModal" aria-labelledby="weightModalTitle">

  <h2 id="weightModalTitle">Add Weight</h2>

  <form id="weightForm">

    <!-- DATE -->
    <label for="weightDate">Date</label>
    <input
      type="date"
      id="weightDate"
      required
    >

    <!-- WEIGHT SELECTOR -->
   <label for="weightInput">Weight (kg)</label>

    <input
        type="number"
        id="weightInput"
        inputmode="decimal"
        min="20"
        max="300"
        step="0.1"
        placeholder="e.g. 87.5"
        required
>

    <!-- ACTION BUTTONS -->
    <div class="modal-actions">

      <button
        type="button"
        id="cancelWeightModal"
      >
        Cancel
      </button>

      <button
        type="submit"
        class="primary-button"
      >
        Save Weight
      </button>

    </div>

  </form>

</dialog>


    <!-- WORKOUTS PAGE -->
    <section id="workouts" class="page">

      <h1>Workouts</h1>

      <div class="card">

        <h2>Your Programmes</h2>

        <p>
          Your workout programmes will appear here.
        </p>

      </div>

    </section>

  </main>


  <!-- BOTTOM NAVIGATION -->
  <nav>

    <button
      id="dashboardButton"
      class="active"
      onclick="showPage('dashboard')">
      🏠 Dashboard
    </button>

    <button
      id="workoutsButton"
      onclick="showPage('workouts')">
      💪 Workouts
    </button>

  </nav>


  <!-- NAVIGATION FUNCTION -->
  <script>

    function showPage(pageId) {

      // Hide both pages
      document.querySelectorAll(".page").forEach(page => {
        page.classList.remove("active");
      });

      // Remove active button highlights
      document.querySelectorAll("nav button").forEach(button => {
        button.classList.remove("active");
      });

      // Show selected page
      document.getElementById(pageId).classList.add("active");

      // Highlight selected navigation button
      document.getElementById(pageId + "Button").classList.add("active");

    }

  </script>

  <script src="storage.js"></script>
  <script src="dashboard.js?v=4"></script>

</body>
</html>
